services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      # overrides whatever DATABASE_URL is in .env so the db file lives in a
      # named volume instead of the container's ephemeral filesystem
      DATABASE_URL: sqlite:////data/pr_analyzer.db
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
