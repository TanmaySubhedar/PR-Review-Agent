server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Mirrors frontend/vite.config.ts's dev-time proxy so the built dist/
    # bundle talks to the backend service by its Docker Compose DNS name.
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Expose the GitHub webhook endpoint through this port as well.
    # GitHub can target either :8001 (direct) or :5173/webhooks/* (via nginx).
    location /webhooks/ {
        proxy_pass http://backend:8001/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reviews can take a while; prevent nginx from timing out mid-pipeline.
        proxy_read_timeout 120s;
    }
}
