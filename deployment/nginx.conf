server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Mirrors frontend/vite.config.ts's dev-time proxy so the built dist/
    # bundle talks to the backend service by its Docker Compose DNS name,
    # the same way `vite dev` proxies to 127.0.0.1 locally.
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
