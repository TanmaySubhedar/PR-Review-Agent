[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Repository-aware autonomous PR review CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
    "PyGithub>=2.4",
    "litellm>=1.55",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "networkx>=3.4",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
pr-agent = "pr_review_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=tests/fixtures"
